<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills - Portfolio</title>
    <link rel="stylesheet" href="skill.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <header class="header">
        <a href="home.html" class="logo">Portfolio.</a>
        <nav class="navbar">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="service.html">Services</a>
            <a href="skill.html" class="active">Skills</a>
            <a href="shop.html">Shop</a>
            <a href="contant.html">Contact</a>
        </nav>
    </header>

    <section class="skills-section">
        <div class="skills-container">
            <div class="skills-column">
                <h2 class="skills-title">Technical Skills</h2>
                <div class="skills-box">
                    <div class="skill-bar">
                        <div class="info">
                            <p><i class='bx bxl-html5'></i> HTML</p>
                            <span>90%</span>
                        </div>
                        <div class="bar-line"><span class="html-line"></span></div>
                    </div>

                    <div class="skill-bar">
                        <div class="info">
                            <p><i class='bx bxl-css3' ></i> CSS</p>
                            <span>80%</span>
                        </div>
                        <div class="bar-line"><span class="css-line"></span></div>
                    </div>

                    <div class="skill-bar">
                        <div class="info">
                            <p><i class='bx bxl-javascript' ></i> Javascript</p>
                            <span>75%</span>
                        </div>
                        <div class="bar-line"><span class="js-line"></span></div>
                    </div>

                    <div class="skill-bar">
                        <div class="info">
                            <p><i class='bx bxl-python' ></i> Python</p>
                            <span>70%</span>
                        </div>
                        <div class="bar-line"><span class="python-line"></span></div>
                    </div>

                    <div class="skill-bar">
                        <div class="info">
                            <p><i class='bx bxl-react' ></i> React</p>
                            <span>75%</span>
                        </div>
                        <div class="bar-line"><span class="react-line"></span></div>
                    </div>

                    <div class="skill-bar">
                        <div class="info">
                            <p><i class='bx bxl-php' ></i> PHP</p>
                            <span>50%</span>
                        </div>
                        <div class="bar-line"><span class="php-line"></span></div>
                    </div>

                    <div class="skill-bar">
                        <div class="info">
                            <p><i class='bx bxl-wordpress' ></i> Wordpress</p>
                            <span>55%</span>
                        </div>
                        <div class="bar-line"><span class="wordpress-line"></span></div>
                    </div>

                    <div class="skill-bar">
                        <div class="info">
                            <p><i class='bx bxl-java' ></i> Java</p>
                            <span>45%</span>
                        </div>
                        <div class="bar-line"><span class="java-line"></span></div>
                    </div>
                </div>
            </div>

            <div class="skills-column">
                <h2 class="skills-title">Professional Skills</h2>
                <div class="radial-bars-grid">
                    <div class="radial-bar">
                        <svg viewBox="0 0 200 200">
                            <circle class="progress-bar-bg" cx="100" cy="100" r="80"></circle>
                            <circle class="progress-bar-loading creativity" cx="100" cy="100" r="80"></circle>
                        </svg>
                        <div class="percentage">90%</div>
                        <div class="text">Creativity</div>
                    </div>

                    <div class="radial-bar">
                        <svg viewBox="0 0 200 200">
                            <circle class="progress-bar-bg" cx="100" cy="100" r="80"></circle>
                            <circle class="progress-bar-loading communication" cx="100" cy="100" r="80"></circle>
                        </svg>
                        <div class="percentage">75%</div>
                        <div class="text">Communication</div>
                    </div>

                    <div class="radial-bar">
                        <svg viewBox="0 0 200 200">
                            <circle class="progress-bar-bg" cx="100" cy="100" r="80"></circle>
                            <circle class="progress-bar-loading problem-solving" cx="100" cy="100" r="80"></circle>
                        </svg>
                        <div class="percentage">70%</div>
                        <div class="text">Problem Solving</div>
                    </div>

                    <div class="radial-bar">
                        <svg viewBox="0 0 200 200">
                            <circle class="progress-bar-bg" cx="100" cy="100" r="80"></circle>
                            <circle class="progress-bar-loading teamwork" cx="100" cy="100" r="80"></circle>
                        </svg>
                        <div class="percentage">85%</div>
                        <div class="text">Teamwork</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
