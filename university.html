<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Animation</title>

<style>
*{
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    background:#000;
}

canvas{
    display:block;
}
</style>

</head>
<body>

<canvas id="canvas"></canvas>

<script>
// Canvas setup and resolution scaling
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const dpr = Math.max(1, window.devicePixelRatio || 1);

let width = 0;
let height = 0;
let cx = 0;
let cy = 0;
let maxGalaxyRadius = 0;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = width * 0.5;
    cy = height * 0.5;
    maxGalaxyRadius = Math.min(width, height) * 0.45;
}
resize();
window.addEventListener('resize', resize);

const palette = [
    { h: 210, s: 100, l: 90 },
    { h: 185, s: 100, l: 80 },
    { h: 275, s: 100, l: 78 },
    { h: 330, s: 100, l: 76 },
    { h: 24, s: 100, l: 72 },
    { h: 0, s: 0, l: 100 }
];

const mouse = { x: cx, y: cy };
const camera = {
    offsetX: 0,
    offsetY: 0,
    targetX: 0,
    targetY: 0,
    zoom: 1,
    targetZoom: 1,
    drift: 0
};

const stars = [];
const dust = [];
const nebulae = [];
const galaxy = [];
const pulses = [];
const gravityBursts = [];

const STAR_COUNT = 1200;
const DUST_COUNT = 520;
const GALAXY_COUNT = 1800;
const ARM_COUNT = 4;

// Utility helpers for randomness, clamping, and easing
function rand(min, max) {
    return Math.random() * (max - min) + min;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function easeOutQuad(t) {
    return 1 - (1 - t) * (1 - t);
}

// Background star field with independent twinkling
class Star {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = rand(-width * 0.6, width * 0.6);
        this.y = rand(-height * 0.6, height * 0.6);
        this.size = rand(0.5, 1.4);
        this.phase = rand(0, Math.PI * 2);
        this.speed = rand(0.0015, 0.0065);
        this.alpha = rand(0.2, 0.85);
    }
    update(dt) {
        this.phase += this.speed * dt;
        this.alpha = 0.55 + Math.sin(this.phase) * 0.18;
    }
    draw(ctx) {
        const x = this.x + cx + camera.offsetX * 0.24;
        const y = this.y + cy + camera.offsetY * 0.24;
        if (x < -10 || x > width + 10 || y < -10 || y > height + 10) return;
        ctx.fillStyle = `rgba(255,255,255,${this.alpha * 0.75})`;
        ctx.fillRect(x, y, this.size, this.size);
    }
}

// Floating cosmic dust that drifts inward around the galaxy
class Dust {
    constructor() {
        this.reset();
    }
    reset() {
        this.angle = rand(0, Math.PI * 2);
        this.radius = rand(width * 0.2, width * 0.65);
        this.speed = rand(0.00008, 0.00024);
        this.baseSize = rand(0.7, 1.6);
        this.offset = rand(-18, 18);
        this.alpha = rand(0.05, 0.14);
        this.hue = rand(190, 260);
    }
    update(dt) {
        this.angle += this.speed * dt;
        this.radius -= dt * 0.03;
        if (this.radius < 20) this.reset();
        this.x = Math.cos(this.angle + this.offset * 0.03) * this.radius;
        this.y = Math.sin(this.angle - this.offset * 0.02) * this.radius * 0.42 + Math.sin(this.angle * 1.7) * 18;
    }
    draw(ctx) {
        const x = this.x + cx + camera.offsetX * 0.16;
        const y = this.y + cy + camera.offsetY * 0.16;
        ctx.fillStyle = `hsla(${this.hue}, 80%, 88%, ${this.alpha})`;
        ctx.fillRect(x, y, this.baseSize, this.baseSize);
    }
}

// Ambient nebula clouds rendered with soft gradients
class Nebula {
    constructor() {
        this.reset();
    }
    reset() {
        const radius = rand(width * 0.35, width * 0.65);
        const angle = rand(0, Math.PI * 2);
        this.x = Math.cos(angle) * radius * 0.6;
        this.y = Math.sin(angle) * radius * 0.36;
        this.radius = rand(width * 0.18, width * 0.34);
        this.speed = rand(0.00012, 0.00032);
        this.phase = rand(0, Math.PI * 2);
        this.hue = rand(220, 320);
        this.saturation = rand(40, 85);
        this.lightness = rand(26, 48);
        this.alpha = rand(0.08, 0.16);
    }
    update(dt) {
        this.phase += this.speed * dt * 0.6;
        const drift = Math.sin(this.phase) * 12;
        this.x += drift * 0.003 * dt;
        this.y += Math.cos(this.phase * 0.9) * 0.002 * dt;
    }
    draw(ctx) {
        const ox = cx + camera.offsetX * 0.5;
        const oy = cy + camera.offsetY * 0.5;
        const gradient = ctx.createRadialGradient(
            ox + this.x,
            oy + this.y,
            this.radius * 0.12,
            ox + this.x,
            oy + this.y,
            this.radius
        );
        gradient.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.alpha})`);
        gradient.addColorStop(0.45, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness - 8}%, ${this.alpha * 0.42})`);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(ox + this.x, oy + this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// Galaxy particle system with spiral arms and trailing motion
class GalaxyParticle {
    constructor() {
        this.reset();
    }
    reset() {
        this.arm = Math.floor(Math.random() * ARM_COUNT);
        this.baseRadius = 30 + Math.pow(Math.random(), 2.3) * maxGalaxyRadius;
        this.angle = rand(0, Math.PI * 2);
        this.speed = (0.00014 + (1 - this.baseRadius / maxGalaxyRadius) * 0.0008) * rand(0.92, 1.18);
        this.size = 0.7 + Math.pow(Math.random(), 3) * 2.6;
        const color = palette[Math.floor(rand(0, palette.length))];
        this.hue = color.h;
        this.saturation = color.s;
        this.lightness = color.l;
        this.alpha = rand(0.28, 0.86);
        this.twist = rand(-0.38, 0.38);
        this.scatter = rand(-6, 6);
        this.phase = rand(0, Math.PI * 2);
        this.trail = [];
        this.x = 0;
        this.y = 0;
        this.px = 0;
        this.py = 0;
    }
    update(dt) {
        const nx = (mouse.x - cx) / cx;
        const ny = (mouse.y - cy) / cy;
        this.angle += this.speed * dt * (1 + nx * 0.05 + ny * 0.04);
        const spiralOffset = this.baseRadius * 0.012;
        const armBase = (this.arm / ARM_COUNT) * Math.PI * 2;
        const swirl = Math.sin(this.angle * 2.4 + this.phase) * 8 * (this.baseRadius / maxGalaxyRadius);
        const radius = this.baseRadius + Math.sin(this.angle * 1.8 + this.phase) * 3.4;
        const tilt = armBase + this.angle * 0.72 + spiralOffset + this.twist;
        this.px = this.x;
        this.py = this.y;
        this.x = Math.cos(tilt + this.scatter * 0.02) * radius;
        this.y = Math.sin(tilt + this.scatter * 0.02) * radius * 0.58 + swirl;
        this.trail.unshift({ x: this.x, y: this.y, a: this.alpha * 0.16 });
        if (this.trail.length > 4) this.trail.pop();
    }
    draw(ctx) {
        const ox = cx + camera.offsetX;
        const oy = cy + camera.offsetY;
        if (this.trail.length > 1) {
            ctx.strokeStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.alpha * 0.22})`;
            ctx.lineWidth = this.size * 1.1;
            ctx.beginPath();
            ctx.moveTo(ox + this.trail[0].x, oy + this.trail[0].y);
            for (let i = 1; i < this.trail.length; i += 1) {
                ctx.lineTo(ox + this.trail[i].x, oy + this.trail[i].y);
            }
            ctx.stroke();
        }
        const gradient = ctx.createRadialGradient(
            ox + this.x,
            oy + this.y,
            0,
            ox + this.x,
            oy + this.y,
            this.size * 4
        );
        gradient.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, 95%, ${this.alpha})`);
        gradient.addColorStop(0.45, `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.alpha * 0.55})`);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(ox + this.x, oy + this.y, this.size * 2.4, 0, Math.PI * 2);
        ctx.fill();
    }
}

// Interaction pulse effect triggered by click
class Pulse {
    constructor() {
        this.time = 0;
        this.duration = 0.84;
    }
    update(dt) {
        this.time += dt * 0.001;
    }
    draw(ctx) {
        const t = this.time / this.duration;
        const alpha = (1 - t) * 0.28;
        const radius = 80 + easeOutQuad(t) * 470;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = `rgba(129, 233, 255, ${alpha})`;
        ctx.lineWidth = 2 + (1 - t) * 8;
        ctx.beginPath();
        ctx.arc(cx + camera.offsetX, cy + camera.offsetY, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
    get alive() {
        return this.time < this.duration;
    }
}

// Gravity burst effect triggered by double click
class GravityBurst {
    constructor() {
        this.time = 0;
        this.duration = 1.0;
    }
    update(dt) {
        this.time += dt * 0.001;
    }
    draw(ctx) {
        const t = this.time / this.duration;
        const radius = 70 + easeOutQuad(t) * 620;
        const alpha = (1 - t) * 0.35;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 10; i += 1) {
            const angle = (i / 10) * Math.PI * 2 + t * 3.2;
            const x = Math.cos(angle) * radius * 0.88;
            const y = Math.sin(angle) * radius * 0.64;
            ctx.strokeStyle = `rgba(255, 126, 200, ${alpha * 0.65})`;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(cx + camera.offsetX + x, cy + camera.offsetY + y);
            ctx.lineTo(cx + camera.offsetX + x * 1.15, cy + camera.offsetY + y * 1.15);
            ctx.stroke();
        }
        ctx.strokeStyle = `rgba(183, 91, 255, ${alpha * 0.22})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx + camera.offsetX, cy + camera.offsetY, radius * 0.84, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
    get alive() {
        return this.time < this.duration;
    }
}

// Initialize the star field, dust, nebulae, and galaxy particles
function createScene() {
    for (let i = 0; i < STAR_COUNT; i += 1) stars.push(new Star());
    for (let i = 0; i < DUST_COUNT; i += 1) dust.push(new Dust());
    for (let i = 0; i < 5; i += 1) nebulae.push(new Nebula());
    for (let i = 0; i < GALAXY_COUNT; i += 1) galaxy.push(new GalaxyParticle());
}
createScene();

window.addEventListener('mousemove', event => {
    mouse.x = event.clientX;
    mouse.y = event.clientY;
});
window.addEventListener('click', () => {
    pulses.push(new Pulse());
});
window.addEventListener('dblclick', () => {
    gravityBursts.push(new GravityBurst());
});

// Update cinematic camera movement and breathing zoom
function updateCamera(dt) {
    camera.targetX = clamp(((mouse.x - cx) / cx) * 26, -36, 36);
    camera.targetY = clamp(((mouse.y - cy) / cy) * 18, -24, 24);
    camera.targetX += Math.sin(camera.drift * 0.9) * 3;
    camera.targetY += Math.cos(camera.drift * 1.4) * 1.6;
    camera.offsetX += (camera.targetX - camera.offsetX) * 0.09;
    camera.offsetY += (camera.targetY - camera.offsetY) * 0.09;
    camera.targetZoom = 1 + Math.sin(performance.now() * 0.0006) * 0.015;
    camera.zoom += (camera.targetZoom - camera.zoom) * 0.05;
    camera.drift += dt * 0.00012;
}

// Draw the deep background fog and space gradient
function drawBackground() {
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(0, 0, width, height);
    const spaceFog = ctx.createRadialGradient(
        cx + camera.offsetX * 0.4,
        cy + camera.offsetY * 0.4,
        0,
        cx + camera.offsetX * 0.4,
        cy + camera.offsetY * 0.4,
        width * 0.75
    );
    spaceFog.addColorStop(0, 'rgba(12, 14, 38, 0.45)');
    spaceFog.addColorStop(0.55, 'rgba(5, 8, 24, 0.72)');
    spaceFog.addColorStop(1, 'rgba(0, 0, 0, 1)');
    ctx.fillStyle = spaceFog;
    ctx.fillRect(0, 0, width, height);
}

function drawStars() {
    stars.forEach(star => star.draw(ctx));
}

function drawNebulae() {
    nebulae.forEach(nebula => nebula.draw(ctx));
}

function drawDust() {
    dust.forEach(d => d.draw(ctx));
}

// Render the spiral galaxy particle system with glow blending
function drawGalaxy() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    galaxy.forEach(p => p.draw(ctx));
    ctx.restore();
}

// Render the glowing galactic center, accretion disk, and black hole
function drawCore(time) {
    const ox = cx + camera.offsetX;
    const oy = cy + camera.offsetY;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const coreGlow = ctx.createRadialGradient(ox, oy, 0, ox, oy, 220);
    coreGlow.addColorStop(0, 'rgba(255, 255, 255, 0.96)');
    coreGlow.addColorStop(0.12, 'rgba(176, 227, 255, 0.86)');
    coreGlow.addColorStop(0.26, 'rgba(90, 154, 255, 0.18)');
    coreGlow.addColorStop(0.55, 'rgba(15, 12, 42, 0)');
    ctx.fillStyle = coreGlow;
    ctx.beginPath();
    ctx.arc(ox, oy, 220, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(ox, oy);
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 5; i += 1) {
        const radius = 48 + i * 14 + Math.sin(time * 0.002 + i * 1.3) * 8;
        ctx.strokeStyle = `hsla(${210 + i * 14}, 100%, ${78 - i * 10}%, ${0.18 - i * 0.02})`;
        ctx.lineWidth = 4 - i * 0.6;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(ox, oy);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 180, 255, 0.16)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(120, 205, 255, 0.22)';
    ctx.lineWidth = 26;
    ctx.beginPath();
    ctx.arc(ox, oy, 40, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
}

// Draw active interaction pulses and gravity wave bursts
function drawEffects() {
    pulses.forEach(pulse => pulse.draw(ctx));
    gravityBursts.forEach(burst => burst.draw(ctx));
}

let lastTime = performance.now();
function animate(time) {
    const dt = Math.min(33, time - lastTime);
    lastTime = time;
    updateCamera(dt);
    stars.forEach(star => star.update(dt));
    dust.forEach(d => d.update(dt));
    nebulae.forEach(n => n.update(dt));
    galaxy.forEach(p => p.update(dt));
    pulses.forEach(p => p.update(dt));
    gravityBursts.forEach(b => b.update(dt));
    for (let i = pulses.length - 1; i >= 0; i -= 1) {
        if (!pulses[i].alive) pulses.splice(i, 1);
    }
    for (let i = gravityBursts.length - 1; i >= 0; i -= 1) {
        if (!gravityBursts[i].alive) gravityBursts.splice(i, 1);
    }
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-cx, -cy);
    drawBackground();
    drawStars();
    drawNebulae();
    drawDust();
    drawGalaxy();
    drawCore(time);
    drawEffects();
    ctx.restore();
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>

</body>
</html>
